management:
  endpoints:
    web:
      exposure:
        include: health, metrics, flyway     # flyway = list of applied migrations
  endpoint:
    health:
      show-details: always                    # see db / disk status locally

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"            # put the request ID next to the level
  level:
    org.springframework.jdbc.core.JdbcTemplate: DEBUG   # SQL count (N+1 check from Lesson 34)